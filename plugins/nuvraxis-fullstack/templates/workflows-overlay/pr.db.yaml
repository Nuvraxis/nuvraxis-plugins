  # Added by nuvraxis-fullstack. Runs the exact migration artefact the Kubernetes Job runs
  # (the bundled dist/migrate.mjs) against a real Postgres 17, twice, then the db tests.
  db:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails on migrations that conflict across branches, and on schema changes without one.
      - run: pnpm --filter @__SCOPE__/db exec drizzle-kit check
      - run: pnpm exec turbo run build --filter=@__SCOPE__/db
      - name: Run the bundled migrator twice (the second run must be a no-op)
        run: |
          node packages/db/dist/migrate.mjs
          node packages/db/dist/migrate.mjs | tee second-run.log
          grep -q "database is up to date" second-run.log
      - run: pnpm --filter @__SCOPE__/db test
